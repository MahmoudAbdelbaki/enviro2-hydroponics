services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hydro
      POSTGRES_PASSWORD: hydro_dev_password
      POSTGRES_DB: hydro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hydro -d hydro"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  hydro:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HYDRO_HTTP_ADDR: ":8080"
      HYDRO_DATABASE_URL: "postgres://hydro:hydro_dev_password@postgres:5432/hydro?sslmode=disable"
      HYDRO_ML_API_KEY: "sensor-x-dev-ml-key"
      HYDRO_LOG_LEVEL: "info"
    ports:
      - "8080:8080"

volumes:
  pgdata:
